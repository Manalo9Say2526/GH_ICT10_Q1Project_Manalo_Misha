    <h1>SKU GENERATOR</h1>
    <form>

       <label>PRODUCT NAME:</label><br>

        <label>STOCK QUANTITY:</label><br>
            <input type="number" id="quantity" placeholder="e.g. 50" class="form-control"><br><br>

        <button type="button" class="btn btn-warning" py-click="generate_SKU">GENERATE SKU</button>
    </form>
